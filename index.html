<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bookmarked</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MENU BAR -->
<div id="menubar">
  <span class="mb-apple">🐙</span>
  <span class="mb-title">shivani's bookmarks</span>
  <span class="mb-spacer"></span>
  <span class="mb-clock" id="clock"></span>
</div>

<!-- DESKTOP (icons + windows injected by app.js) -->
<div id="desktop"></div>
<div id="mobile-note" class="window">
  <div class="title-bar">
    <span class="title-text">notice</span>
    <button class="close-box" id="mobile-note-close" title="close"></button>
  </div>
  <div class="window-body mobile-note-body">this website is designed for a desktop viewing</div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>window.addEventListener('load', function(){ if(window.innerWidth > 640) openSheet(); });</script>
</body>
</html>
