<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bookmarked</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  shivani's bookmarks from the world wide web, organised. <a href="mailto:shivani.singh@cca.edu">submit a site →</a>
  <a class="stumble-link" href="#" onclick="stumble()">go to random site ↗</a></header>

<nav class="site-nav">
  <div class="nav-views">
    <button class="nav-btn active" id="btn-tags" onclick="setView('tags')">explore</button>
    <button class="nav-btn" id="btn-explore" onclick="setView('explore')">categories</button>
    <button class="nav-btn" id="btn-table" onclick="setView('table')">table</button>
  </div>
  <button class="clear-btn" onclick="clearCurrent()">clear</button>
</nav>

<!-- EXPLORE -->
<div id="view-explore">
  <div class="ex-row ex-row-top" id="ex-row-top"></div>
  <div class="ex-row ex-row-bottom" id="ex-row-bottom"></div>
  <div class="sites-panel" id="ex-sites-panel" style="display:none">
    <div class="sites-header">sites tagged <strong id="ex-active-tag"></strong></div>
    <div class="sites-cloud" id="ex-sites-cloud"></div>
  </div>
</div>

<!-- TAGS -->
<div id="view-tags" style="display:none">
  <div class="tags-cloud" id="tv-cloud"></div>
  <div class="sites-panel" id="tv-sites-panel" style="display:none">
    <div class="sites-cloud" id="tv-sites-cloud"></div>
  </div>
</div>

<!-- TABLE -->
<div id="view-table" style="display:none">
  <div class="cat-row">
    <span class="cat-label">category</span>
    <button class="cat-pill cp-Design"            data-cat="Design"              onclick="toggleCat('Design')">Design</button>
    <button class="cat-pill cp-Tools"             data-cat="Tools"               onclick="toggleCat('Tools')">Tools</button>
    <button class="cat-pill cp-EyeCandy"          data-cat="Eye Candy"           onclick="toggleCat('Eye Candy')">Eye Candy</button>
    <button class="cat-pill cp-LearningCommunity" data-cat="Learning & Community" onclick="toggleCat('Learning & Community')">Learning &amp; Community</button>
    <button class="cat-pill cp-Collaboration"     data-cat="Collaboration"       onclick="toggleCat('Collaboration')">Collaboration</button>
    <button class="cat-pill cp-TimePass"          data-cat="Time Pass"           onclick="toggleCat('Time Pass')">Time Pass</button>
  </div>
  <div class="search-row">
    <input type="text" id="search" placeholder="search&hellip;" oninput="render()">
    <span class="count" id="count"></span>
  </div>
  <table>
    <thead><tr>
      <th onclick="sortBy('label')">Domain <span id="arr">&uarr;</span></th>
      <th>Category</th>
      <th>Tags</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<footer>
  <div class="bm-wrap">
    <a class="bm-btn" id="bm-link" href="#"> 🐙 </a>
    <span class="bm-hint">&mdash; drag this octopus to your bookmarks bar and click to stumble upon a site from this directory anytime.</span>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
