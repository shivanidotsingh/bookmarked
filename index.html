<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bookmarked</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- DESKTOP (icons + windows injected by app.js) -->
<div id="desktop"></div>
<div id="landing-modal" class="window" style="display:none;">
  <div class="title-bar">
    <span class="title-text">hello internet explorer!</span>
  </div>
  <div class="window-body landing-body">
    <p>this website is a curation of shivani's bookmarks. how would you like to navigate?
    <div class="landing-ctas">
      <button id="landing-stumble-btn"> stumble </button>
      <button id="landing-browse-btn"> browse </button>
    </div>
  </div>
</div>
<div id="mobile-note" class="window">
  <div class="title-bar">
    <span class="title-text">hello internet explorer!</span>
  </div>
  <div class="window-body mobile-note-body">
    this website is a catalogue of shivani's bookmarks, best browsed on desktop.
    <button id="mobile-stumble-btn"> stumble upon a site </button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>window.addEventListener('load', function(){ if(window.innerWidth > 640) showLandingOrSheet(); });</script>
</body>
</html>
